version: 2

models:
  - name: int_synthetic_anomaly_evaluation
    description: Compact labeled evaluation dataset combining sampled normal records with synthetic TransitPulse anomaly examples for detector development and regression checks.
    columns:
      - name: evaluation_record_id
        description: Stable synthetic evaluation row identifier.
        data_tests:
          - not_null
          - unique
      - name: source_model
        description: Upstream dbt model used as the source for the evaluation row.
        data_tests:
          - not_null
      - name: evaluation_record_type
        description: Record family represented by the evaluation row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - trip_performance
                  - vehicle_position
                  - trip_update
                  - trip_schedule_alignment
      - name: snapshot_folder
        description: Captured realtime snapshot folder associated with the source record.
        data_tests:
          - not_null
      - name: snapshot_timestamp_utc
        description: UTC timestamp when the source snapshot was captured.
        data_tests:
          - not_null
      - name: trip_id
        description: Trip identifier when present for the evaluation row.
      - name: route_id
        description: Route identifier associated with the evaluation row.
        data_tests:
          - not_null
      - name: vehicle_id
        description: Vehicle identifier when present for the evaluation row.
      - name: estimated_delay_minutes
        description: Schedule-derived delay value for trip performance rows, including injected delay outliers when applicable.
      - name: delay_sanity_status
        description: Delay sanity label carried from or assigned for the evaluation row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - delay_unavailable
                  - plausible
                  - extreme_early
                  - extreme_late
      - name: delay_band
        description: Delay band carried from or assigned for the evaluation row.
        data_tests:
          - not_null
      - name: is_synthetic_anomaly
        description: Ground-truth boolean label indicating whether the row is an injected synthetic anomaly.
        data_tests:
          - not_null
      - name: synthetic_anomaly_type
        description: Ground-truth anomaly class label, or normal for baseline records.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - normal
                  - stale_vehicle_position_timestamp
                  - gps_jump_or_implausible_speed
                  - duplicate_trip_update_entity
                  - missing_or_unmatched_schedule_reference
                  - late_or_extreme_delay_outlier
      - name: anomaly_severity
        description: Ground-truth synthetic anomaly severity label.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - none
                  - medium
                  - high
                  - critical
      - name: anomaly_reason
        description: Human-readable explanation of why the evaluation row is normal or anomalous.
        data_tests:
          - not_null
