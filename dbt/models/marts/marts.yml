version: 2

models:
  - name: fct_feed_quality
    description: Snapshot-level feed quality fact table summarizing GTFS-RT completeness, GPS quality, duplicate entity checks, trip alignment, and freshness status.
    columns:
      - name: snapshot_folder
        description: Timestamped raw realtime snapshot folder. This is the grain of the model, with one row per captured snapshot folder.
        data_tests:
          - not_null
      - name: snapshot_timestamp_utc
        description: UTC timestamp when the realtime snapshot was captured.
        data_tests:
          - not_null
      - name: vehicle_record_count
        description: Number of GTFS-RT vehicle position records captured in the snapshot.
      - name: trip_update_record_count
        description: Number of GTFS-RT trip update records captured in the snapshot.
      - name: total_realtime_records
        description: Combined count of vehicle position and trip update records in the snapshot.
      - name: null_gps_count
        description: Count of vehicle position records missing latitude or longitude.
      - name: duplicate_vehicle_entity_count
        description: Count of duplicated vehicle entities identified within the same snapshot.
      - name: duplicate_trip_update_entity_count
        description: Count of duplicated trip update entities identified within the same snapshot.
      - name: unmatched_realtime_trip_count
        description: Count of realtime trip IDs that did not match the aligned static schedule.
      - name: snapshot_gap_minutes
        description: Minutes elapsed since the previous captured realtime snapshot.
      - name: freshness_status
        description: Snapshot freshness bucket based on the elapsed time since the prior snapshot.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - first_snapshot
                  - within_expected_interval
                  - late
      - name: feed_quality_status
        description: Overall feed quality status for the snapshot.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - healthy
                  - warning
                  - critical
      - name: null_gps_rate
        description: Share of vehicle position records missing latitude or longitude.
      - name: duplicate_trip_update_rate
        description: Share of trip update records flagged as duplicate entities.
      - name: unmatched_realtime_trip_rate
        description: Share of total realtime records with unmatched realtime trip IDs.
      - name: feed_completeness_proxy
        description: Simple completeness indicator equal to 1.0 when both vehicle positions and trip updates were captured, otherwise 0.0.

  - name: dim_route
    description: Route dimension with one row per source_feed and route_id from the aligned MTA bus static GTFS feeds.
    columns:
      - name: route_key
        description: Stable route dimension key built from source_feed and route_id.
        data_tests:
          - not_null
          - unique
      - name: source_feed
        description: Static GTFS feed origin for the route. This is part of the dimension grain because route_id values can repeat across MTA bus feed files.
        data_tests:
          - not_null
      - name: route_id
        description: GTFS route identifier, unique within source_feed.
        data_tests:
          - not_null
      - name: agency_id
        description: Agency identifier for the route.
      - name: route_short_name
        description: Public route short name.
      - name: route_long_name
        description: Public route long name.
      - name: route_type
        description: GTFS route type code.

  - name: dim_stop
    description: Stop dimension with one row per source_feed and stop_id from the aligned MTA bus static GTFS feeds.
    columns:
      - name: stop_key
        description: Stable stop dimension key built from source_feed and stop_id.
        data_tests:
          - not_null
          - unique
      - name: source_feed
        description: Static GTFS feed origin for the stop. This is part of the dimension grain because stop_id values can repeat across MTA bus feed files.
        data_tests:
          - not_null
      - name: stop_id
        description: GTFS stop identifier, unique within source_feed.
        data_tests:
          - not_null
      - name: stop_name
        description: Public stop name.
      - name: stop_lat
        description: Stop latitude.
        data_tests:
          - not_null
      - name: stop_lon
        description: Stop longitude.
        data_tests:
          - not_null

  - name: fct_route_realtime_activity
    description: Route-level realtime activity fact table with one row per route_id and snapshot_folder, summarizing vehicle position and trip update coverage without joining to source-feed-grained route dimensions.
    columns:
      - name: snapshot_folder
        description: Timestamped raw realtime snapshot folder.
        data_tests:
          - not_null
      - name: snapshot_timestamp_utc
        description: UTC timestamp when the realtime snapshot was captured.
        data_tests:
          - not_null
      - name: route_id
        description: Realtime route identifier. source_feed is intentionally not part of this fact grain because GTFS-RT route IDs do not carry source feed origin.
        data_tests:
          - not_null
      - name: vehicle_position_count
        description: Count of vehicle position records for the route in the snapshot.
      - name: trip_update_count
        description: Count of trip update records for the route in the snapshot.
      - name: distinct_vehicle_count
        description: Count of distinct realtime vehicles reported for the route in the snapshot.
      - name: distinct_trip_count
        description: Count of distinct realtime trips reported for the route in the snapshot.
      - name: has_vehicle_positions
        description: Boolean indicator that the route had one or more vehicle position records in the snapshot.
      - name: has_trip_updates
        description: Boolean indicator that the route had one or more trip update records in the snapshot.
      - name: total_realtime_records
        description: Combined count of vehicle position and trip update records for the route in the snapshot.
      - name: vehicle_to_trip_update_ratio
        description: Ratio of vehicle position records to trip update records for the route in the snapshot.
      - name: route_activity_status
        description: Activity bucket describing whether the route appeared in both realtime feeds, vehicle positions only, trip updates only, or neither.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - active_with_both_feeds
                  - active_vehicle_only
                  - active_trip_updates_only
                  - inactive_or_missing
