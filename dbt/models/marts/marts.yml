version: 2

models:
  - name: fct_feed_quality
    description: Snapshot-level feed quality fact table summarizing GTFS-RT completeness, GPS quality, duplicate entity checks, trip alignment, and freshness status.
    columns:
      - name: snapshot_folder
        description: Timestamped raw realtime snapshot folder. This is the grain of the model, with one row per captured snapshot folder.
        data_tests:
          - not_null
      - name: snapshot_timestamp_utc
        description: UTC timestamp when the realtime snapshot was captured.
        data_tests:
          - not_null
      - name: vehicle_record_count
        description: Number of GTFS-RT vehicle position records captured in the snapshot.
      - name: trip_update_record_count
        description: Number of GTFS-RT trip update records captured in the snapshot.
      - name: total_realtime_records
        description: Combined count of vehicle position and trip update records in the snapshot.
      - name: null_gps_count
        description: Count of vehicle position records missing latitude or longitude.
      - name: duplicate_vehicle_entity_count
        description: Count of duplicated vehicle entities identified within the same snapshot.
      - name: duplicate_trip_update_entity_count
        description: Count of duplicated trip update entities identified within the same snapshot.
      - name: unmatched_realtime_trip_count
        description: Count of realtime trip IDs that did not match the aligned static schedule.
      - name: snapshot_gap_minutes
        description: Minutes elapsed since the previous captured realtime snapshot.
      - name: freshness_status
        description: Snapshot freshness bucket based on the elapsed time since the prior snapshot.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - first_snapshot
                  - within_expected_interval
                  - late
      - name: feed_quality_status
        description: Overall feed quality status for the snapshot.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - healthy
                  - warning
                  - critical
      - name: null_gps_rate
        description: Share of vehicle position records missing latitude or longitude.
      - name: duplicate_trip_update_rate
        description: Share of trip update records flagged as duplicate entities.
      - name: unmatched_realtime_trip_rate
        description: Share of total realtime records with unmatched realtime trip IDs.
      - name: feed_completeness_proxy
        description: Simple completeness indicator equal to 1.0 when both vehicle positions and trip updates were captured, otherwise 0.0.

  - name: dim_route
    description: Route dimension with one row per source_feed and route_id from the aligned MTA bus static GTFS feeds.
    columns:
      - name: route_key
        description: Stable route dimension key built from source_feed and route_id.
        data_tests:
          - not_null
          - unique
      - name: source_feed
        description: Static GTFS feed origin for the route. This is part of the dimension grain because route_id values can repeat across MTA bus feed files.
        data_tests:
          - not_null
      - name: route_id
        description: GTFS route identifier, unique within source_feed.
        data_tests:
          - not_null
      - name: agency_id
        description: Agency identifier for the route.
      - name: route_short_name
        description: Public route short name.
      - name: route_long_name
        description: Public route long name.
      - name: route_type
        description: GTFS route type code.

  - name: dim_stop
    description: Stop dimension with one row per source_feed and stop_id from the aligned MTA bus static GTFS feeds.
    columns:
      - name: stop_key
        description: Stable stop dimension key built from source_feed and stop_id.
        data_tests:
          - not_null
          - unique
      - name: source_feed
        description: Static GTFS feed origin for the stop. This is part of the dimension grain because stop_id values can repeat across MTA bus feed files.
        data_tests:
          - not_null
      - name: stop_id
        description: GTFS stop identifier, unique within source_feed.
        data_tests:
          - not_null
      - name: stop_name
        description: Public stop name.
      - name: stop_lat
        description: Stop latitude.
        data_tests:
          - not_null
      - name: stop_lon
        description: Stop longitude.
        data_tests:
          - not_null

  - name: fct_route_realtime_activity
    description: Route-level realtime activity fact table with one row per route_id and snapshot_folder, summarizing vehicle position and trip update coverage without joining to source-feed-grained route dimensions.
    columns:
      - name: snapshot_folder
        description: Timestamped raw realtime snapshot folder.
        data_tests:
          - not_null
      - name: snapshot_timestamp_utc
        description: UTC timestamp when the realtime snapshot was captured.
        data_tests:
          - not_null
      - name: route_id
        description: Realtime route identifier. source_feed is intentionally not part of this fact grain because GTFS-RT route IDs do not carry source feed origin.
        data_tests:
          - not_null
      - name: vehicle_position_count
        description: Count of vehicle position records for the route in the snapshot.
      - name: trip_update_count
        description: Count of trip update records for the route in the snapshot.
      - name: distinct_vehicle_count
        description: Count of distinct realtime vehicles reported for the route in the snapshot.
      - name: distinct_trip_count
        description: Count of distinct realtime trips reported for the route in the snapshot.
      - name: has_vehicle_positions
        description: Boolean indicator that the route had one or more vehicle position records in the snapshot.
      - name: has_trip_updates
        description: Boolean indicator that the route had one or more trip update records in the snapshot.
      - name: total_realtime_records
        description: Combined count of vehicle position and trip update records for the route in the snapshot.
      - name: vehicle_to_trip_update_ratio
        description: Ratio of vehicle position records to trip update records for the route in the snapshot.
      - name: route_activity_status
        description: Activity bucket describing whether the route appeared in both realtime feeds, vehicle positions only, trip updates only, or neither.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - active_with_both_feeds
                  - active_vehicle_only
                  - active_trip_updates_only
                  - inactive_or_missing

  - name: fct_on_time_performance
    description: Trip-level on-time performance fact table with one row per trip_id and snapshot_folder, using normalized realtime stop updates matched to scheduled GTFS stop times to estimate delay where supported.
    columns:
      - name: snapshot_folder
        description: Timestamped raw realtime snapshot folder.
        data_tests:
          - not_null
      - name: snapshot_timestamp_utc
        description: UTC timestamp when the realtime snapshot was captured.
        data_tests:
          - not_null
      - name: trip_id
        description: Realtime trip identifier matched to the aligned static schedule.
        data_tests:
          - not_null
      - name: route_id
        description: Realtime route identifier associated with the trip.
        data_tests:
          - not_null
      - name: vehicle_id
        description: Vehicle identifier associated with the trip update.
      - name: trip_headsign
        description: Scheduled trip headsign from static GTFS.
      - name: direction_id
        description: Scheduled GTFS direction identifier.
      - name: schedule_match_status
        description: Whether the realtime trip_id matched the aligned static schedule.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - matched_to_static_schedule
                  - unmatched_realtime_trip
      - name: stop_update_count
        description: Count of realtime stop updates available for the trip in the snapshot.
      - name: matched_stop_update_count
        description: Count of realtime stop updates that matched a scheduled stop time by trip_id, stop_sequence, and stop_id guard where available.
      - name: first_realtime_stop_time_utc
        description: Earliest realtime stop update timestamp for the trip in the snapshot.
      - name: last_realtime_stop_time_utc
        description: Latest realtime stop update timestamp for the trip in the snapshot.
      - name: avg_estimated_delay_minutes
        description: Average estimated delay in minutes across matched realtime stop updates for the trip and snapshot.
      - name: max_estimated_delay_minutes
        description: Maximum estimated delay in minutes across matched realtime stop updates for the trip and snapshot.
      - name: min_estimated_delay_minutes
        description: Minimum estimated delay in minutes across matched realtime stop updates for the trip and snapshot.
      - name: estimated_delay_minutes
        description: Trip-level estimated delay in minutes, currently set to avg_estimated_delay_minutes.
      - name: delay_minutes_abs
        description: Absolute value of estimated_delay_minutes, useful for identifying large schedule-derived delay deviations in either direction.
      - name: on_time_flag
        description: True when estimated_delay_minutes is between -1 and 5 minutes, false when outside that range, and null when delay is unavailable.
      - name: delay_data_status
        description: Indicates whether delay was available, unavailable, or blocked by schedule time parsing.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - delay_available
                  - delay_unavailable
                  - schedule_time_parse_issue
      - name: delay_sanity_status
        description: Sanity classification for schedule-derived delay estimates, separating plausible values from extreme early or late outliers.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - delay_unavailable
                  - plausible
                  - extreme_early
                  - extreme_late
      - name: delay_band
        description: Stakeholder-friendly delay band for grouping trip-snapshot delay estimates.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - unavailable
                  - early_more_than_5_min
                  - early_1_to_5_min
                  - on_time
                  - late_5_to_15_min
                  - late_15_to_30_min
                  - late_30_to_60_min
                  - late_over_60_min

  - name: fct_headway
    description: Route-level vehicle spacing fact table with one row per route_id and snapshot_folder, using vehicle position timestamps as a snapshot-based reliability proxy rather than true stop-level headway.
    columns:
      - name: snapshot_folder
        description: Timestamped raw realtime snapshot folder.
        data_tests:
          - not_null
      - name: snapshot_timestamp_utc
        description: UTC timestamp when the realtime snapshot was captured.
        data_tests:
          - not_null
      - name: route_id
        description: Realtime route identifier for the vehicle positions in the snapshot.
        data_tests:
          - not_null
      - name: vehicle_count
        description: Count of vehicle position records observed for the route in the snapshot.
      - name: distinct_vehicle_count
        description: Count of distinct vehicle IDs observed for the route in the snapshot.
      - name: observed_vehicle_sequence_count
        description: Count of vehicle position records with timestamps available for sequencing within the route and snapshot.
      - name: avg_vehicle_spacing_minutes
        description: Average time gap in minutes between consecutive vehicle timestamps for the route in the snapshot; null when fewer than two vehicles are observed.
      - name: min_vehicle_spacing_minutes
        description: Minimum time gap in minutes between consecutive vehicle timestamps for the route in the snapshot; null when fewer than two vehicles are observed.
      - name: max_vehicle_spacing_minutes
        description: Maximum time gap in minutes between consecutive vehicle timestamps for the route in the snapshot; null when fewer than two vehicles are observed.
      - name: headway_variance_minutes
        description: Standard deviation in minutes of consecutive vehicle timestamp gaps within the route and snapshot; this is a snapshot-based reliability proxy.
      - name: headway_reliability_status
        description: Reliability bucket based on distinct vehicle count and variation in vehicle timestamp spacing.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - insufficient_data
                  - stable
                  - variable
                  - highly_variable

  - name: fct_anomaly_findings
    description: Production-facing anomaly findings fact table with one row per detected TransitPulse rule-based anomaly across snapshot, route, trip, vehicle, and trip-update grains.
    columns:
      - name: anomaly_id
        description: Stable anomaly finding key generated from the detector rule and natural record identifiers.
        data_tests:
          - not_null
          - unique
      - name: anomaly_grain
        description: Grain of the anomaly finding.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - snapshot
                  - vehicle_entity
                  - trip_update_entity
                  - trip_schedule_reference
                  - trip_snapshot
      - name: snapshot_folder
        description: Captured realtime snapshot folder associated with the anomaly finding.
        data_tests:
          - not_null
      - name: snapshot_timestamp_utc
        description: UTC snapshot timestamp when available for the anomaly finding.
      - name: route_id
        description: Route identifier when the finding applies to a route, vehicle, or trip.
      - name: trip_id
        description: Trip identifier when the finding applies to a trip or schedule reference.
      - name: entity_id
        description: Realtime entity identifier when the finding applies to a feed entity.
      - name: vehicle_id
        description: Vehicle identifier when the finding applies to a vehicle or trip update.
      - name: anomaly_type
        description: Production anomaly type assigned by the deterministic rule.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - stale_realtime_timestamp
                  - duplicate_trip_update_entity
                  - unmatched_schedule_reference
                  - missing_or_invalid_gps_coordinate
                  - implausible_gps_or_speed
                  - extreme_delay_outlier
                  - feed_quality_warning
                  - feed_freshness_issue
      - name: anomaly_severity
        description: Severity assigned by the deterministic detector rule.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - medium
                  - high
                  - critical
      - name: anomaly_score
        description: Rule-based anomaly score between 0.0 and 1.0.
        data_tests:
          - not_null
      - name: anomaly_reason
        description: Human-readable explanation of why the anomaly was detected.
        data_tests:
          - not_null
      - name: detector_rule_id
        description: Deterministic rule identifier that emitted the anomaly finding.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - rule_stale_vehicle_timestamp
                  - rule_duplicate_trip_update_entity
                  - rule_unmatched_schedule_reference
                  - rule_missing_gps_coordinate
                  - rule_implausible_gps_or_speed
                  - rule_extreme_delay
                  - rule_feed_quality_warning
                  - rule_feed_freshness
      - name: source_model
        description: dbt model that supplied the records used by the detector rule.
        data_tests:
          - not_null
